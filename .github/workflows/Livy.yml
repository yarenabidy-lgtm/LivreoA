      - name: Extraire le projet
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          echo "ZIP trouvé : $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : Aucun fichier ZIP trouvé"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          echo "=== Recherche de gradlew ==="
          find project -name gradlew -type f

      - name: Créer un APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERREUR : gradlew introuvable"
            exit 1
          fi
          chmod +x "$GRADLEW"
